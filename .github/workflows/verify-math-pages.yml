name: Verify math v10.1
on:
  push:
    branches: [main, math-bdm-50-50]
    paths:
      - 'math-quiz/**'
      - '.github/scripts/math-v10-*.cjs'
      - '.github/workflows/verify-math-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-math-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify entry and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'math-release:10.1' math-quiz/index.html
          for file in v9-bank.js v10-daily.js bdm-bank-v1.js v10.1-hybrid.js v10-figures.js bdm-figures-v1.js v10-app.js; do
            node --check "math-quiz/$file"
          done
      - name: Verify 366 daily sets, 592 BDM combinations and geometry
        run: node .github/scripts/math-v10-content.cjs math-quiz
      - name: Install pinned browser test dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/math-browser" playwright@1.57.0 --no-fund --no-audit
          "$RUNNER_TEMP/math-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser navigation, storage, midnight and scroll
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          for attempt in $(seq 1 20); do curl --silent --fail http://127.0.0.1:4173/math-quiz/ >/dev/null && break; sleep 1; done
          MATH_URL='http://127.0.0.1:4173/math-quiz/?v=10.1' NODE_PATH="$RUNNER_TEMP/math-browser/node_modules" node .github/scripts/math-v10-browser.cjs

  public-url-check:
    if: github.ref == 'refs/heads/main'
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify published entry and exact commit assets
        env:
          BASE: https://haruki40-sys.github.io/dungdung-study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/math-published"
          cd "$RUNNER_TEMP/math-published"
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl --location --silent --show-error --max-time 20 --output index.html --write-out '%{http_code}' "$BASE/math-quiz/?v=10.1&check=$GITHUB_RUN_ID" || true)
            echo "Attempt $attempt: math page HTTP $code"
            if [ "$code" = 200 ] && grep -q 'math-release:10.1' index.html; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" = 1 ]
          for file in index.html v9-bank.js v10-daily.js bdm-bank-v1.js v10.1-hybrid.js v10-figures.js bdm-figures-v1.js v10-app.js v10-style.css; do
            curl --location --silent --show-error --fail --retry 3 --max-time 25 "$BASE/math-quiz/$file?check=$GITHUB_RUN_ID" -o "$file"
            actual=$(git hash-object "$file")
            expected=$(git -C "$GITHUB_WORKSPACE" rev-parse "HEAD:math-quiz/$file")
            [ "$actual" = "$expected" ]
            echo "PASS exact published asset: $file"
          done
          for path in '' 'hanja-quiz/'; do
            code=$(curl --location --silent --show-error --max-time 25 -o /dev/null --write-out '%{http_code}' "$BASE/$path?check=$GITHUB_RUN_ID")
            echo "Existing page $path HTTP $code"
            [ "$code" = 200 ]
          done
      - name: Install pinned browser test dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/math-browser" playwright@1.57.0 --no-fund --no-audit
          "$RUNNER_TEMP/math-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify deployed browser behavior
        env:
          MATH_URL: https://haruki40-sys.github.io/dungdung-study/math-quiz/?v=10.1
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/math-browser/node_modules" node .github/scripts/math-v10-browser.cjs
