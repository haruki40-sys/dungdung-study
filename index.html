<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="한문과 수학을 매일 가볍게 익히는 아이 전용 학습 사이트">
  <title>학습부</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="brand" aria-hidden="true">학</div>
      <div>
        <p class="eyebrow">DUNGDUNG STUDY</p>
        <h1>학습부</h1>
        <p class="intro">오늘 할 공부를 고르고, 어제보다 한 칸 더 나아가요.</p>
      </div>
    </header>

    <section class="subjects" aria-labelledby="subjects-title">
      <h2 id="subjects-title" class="sr-only">과목 선택</h2>
      <a class="subject-card hanja" href="hanja-quiz/">
        <span class="subject-icon" aria-hidden="true">漢</span>
        <span class="subject-copy">
          <span class="subject-label">한문</span>
          <strong>한자사전</strong>
          <span>35개 성어를 익히고 오답만 다시 복습해요.</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject-card math" href="math-quiz/">
        <span class="subject-icon" aria-hidden="true">∑</span>
        <span class="subject-copy">
          <span class="subject-label">수학</span>
          <strong>내신대비 수학</strong>
          <span>매일 새 문제로 개념부터 심화까지 연습해요.</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <p class="storage-note">학습 기록은 이 기기의 브라우저에 저장됩니다.</p>
  </main>
</body>
</html>
